server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 4m;

    location = /api/health {
        proxy_pass http://usuarios/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location = /api/payment-info {
        proxy_pass http://usuarios/payment-info;
        proxy_set_header Host $host;
    }
    location /api/auth/ {
        proxy_pass http://usuarios/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /api/products/categories {
    proxy_pass http://productos/categories;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    }  
    location /api/products {
    rewrite ^/api/products/?(.*)$ /$1 break;
    proxy_pass http://productos;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    }
    location /api/orders {
    rewrite ^/api/orders/?(.*)$ /$1 break;
    proxy_pass http://pedidos;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    }
    location /uploads/ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public";
    }
    location / {
        try_files $uri $uri/ =404;
    }
}
